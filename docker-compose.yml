services:
  mysql:
    # 使用官方 MySQL 镜像 + 挂载初始化 SQL，避免自定义构建
    image: mysql:8.4
    # 限制容器内存，防止小服务器 OOM
    mem_limit: 512m
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    # 不映射宿主机端口，避免与 Coolify 服务器其他 MySQL 冲突
    volumes:
      - mysql:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/001-openhubs-pay-init.sql:ro
    # 健康检查：查询 t_mch_info 表确保 init.sql 已执行完毕
    # 仅 SELECT 1 无法保证表已创建，Java 启动时会因找不到表而崩溃
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysql -uroot -D $${MYSQL_DATABASE} -e \"SELECT 1 FROM t_mch_info LIMIT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    mem_limit: 128m
    expose:
      - "6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  activemq:
    build:
      context: ./docker/activemq
      dockerfile: Dockerfile
    mem_limit: 256m
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
    expose:
      - "61616"
    volumes:
      - activemq:/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61616 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile
    mem_limit: 512m
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
      # 限制 JVM 堆内存，防止小服务器 OOM
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    expose:
      - "9216"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - payment-logs:/openhubshomes/service/logs
      - payment-uploads:/openhubshomes/service/uploads
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile
    mem_limit: 512m
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:?MANAGER_JWT_SECRET is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    expose:
      - "9217"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - manager-logs:/openhubshomes/service/logs
      - manager-uploads:/openhubshomes/service/uploads
    restart: unless-stopped

  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile
    mem_limit: 512m
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MERCHANT_JWT_SECRET: ${MERCHANT_JWT_SECRET:?MERCHANT_JWT_SECRET is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    expose:
      - "9218"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - merchant-logs:/openhubshomes/service/logs
      - merchant-uploads:/openhubshomes/service/uploads
    restart: unless-stopped

  ui-payment:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    mem_limit: 128m
    environment:
      BACKEND_HOST: payment:9216
      PORT: 80
    expose:
      - "80"
    # 不映射宿主机端口：Traefik 通过 coolify 网络路由
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-payment.rule=Host(`${PAYMENT_UI_DOMAIN:-pay.open-hubs.com}`)"
      - "traefik.http.routers.ui-payment.entrypoints=web"
      - "traefik.http.services.ui-payment.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"
    depends_on:
      payment:
        condition: service_started
    restart: unless-stopped

  ui-manager:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    mem_limit: 128m
    environment:
      BACKEND_HOST: manager:9217
      PORT: 80
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-manager.rule=Host(`${MANAGER_DOMAIN:-mpay.open-hubs.com}`)"
      - "traefik.http.routers.ui-manager.entrypoints=web"
      - "traefik.http.services.ui-manager.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"
    depends_on:
      manager:
        condition: service_started
    restart: unless-stopped

  ui-merchant:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    mem_limit: 128m
    environment:
      BACKEND_HOST: merchant:9218
      PORT: 80
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-merchant.rule=Host(`${MERCHANT_DOMAIN:-kpay.open-hubs.com}`)"
      - "traefik.http.routers.ui-merchant.entrypoints=web"
      - "traefik.http.services.ui-merchant.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"
    depends_on:
      merchant:
        condition: service_started
    restart: unless-stopped

  # ============================================================
  # KitfoxPay - 易支付协议适配网关
  # 将 NewAPI 等下游系统的易支付协议请求转换为 Jeepay API 调用
  # ============================================================
  kitfoxpay:
    build:
      context: ./kitfoxpay
      dockerfile: Dockerfile
    mem_limit: 256m
    expose:
      - "9219"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kitfoxpay.rule=Host(`${KITFOX_DOMAIN:-kit.open-hubs.com}`)"
      - "traefik.http.routers.kitfoxpay.entrypoints=web"
      - "traefik.http.services.kitfoxpay.loadbalancer.server.port=9219"
      - "traefik.docker.network=coolify"
    environment:
      JEEPAY_BASE_URL: http://payment:9216
      JEEPAY_MCH_NO: ${KITFOX_MCH_NO:-M1784708760}
      JEEPAY_APP_ID: ${KITFOX_APP_ID:-6a607e98e4b022b84e41f0e2}
      JEEPAY_PRIVATE_KEY: ${KITFOX_PRIVATE_KEY}
      EPAY_PID: ${KITFOX_EPAY_PID:-1001}
      EPAY_KEY: ${KITFOX_EPAY_KEY:-CHANGE_ME_32_CHARS_KEY_HERE}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9219"
      SITE_DOMAIN: ${KITFOX_SITE_DOMAIN:-http://localhost:9219}
      ADMIN_PASSWORD: ${KITFOX_ADMIN_PASSWORD:-admin123}
    depends_on:
      payment:
        condition: service_started
    restart: unless-stopped

# coolify 网络：必须使用 external:true
# Coolify 服务器上的 coolify 网络由 Coolify 自身创建（非 Compose 创建），
# Compose 检测到该网络已存在但不是由 Compose 创建时会拒绝使用，
# 因此必须显式声明 external:true 以复用已有网络。
networks:
  coolify:
    external: true

volumes:
  mysql:
  redis:
  activemq:
  payment-logs:
  payment-uploads:
  manager-logs:
  manager-uploads:
  merchant-logs:
  merchant-uploads:
