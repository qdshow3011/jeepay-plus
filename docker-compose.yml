services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      LANG: C.UTF-8
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysql -uroot -e 'SELECT 1' && MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysql -uroot -e \"SELECT 1 FROM information_schema.tables WHERE table_schema = '$${MYSQL_DATABASE}' AND table_name = 't_sys_config' LIMIT 1\" | grep -q 1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      TZ: Asia/Shanghai
    expose:
      - "6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  activemq:
    build:
      context: ./docker/activemq
      dockerfile: Dockerfile
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      TZ: Asia/Shanghai
    expose:
      - "61616"
    volumes:
      - activemq:/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61616 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9216"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - payment-logs:/jeepayhomes/service/logs
      - payment-uploads:/jeepayhomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9216/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:?MANAGER_JWT_SECRET is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9217"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - manager-logs:/jeepayhomes/service/logs
      - manager-uploads:/jeepayhomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9217/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MERCHANT_JWT_SECRET: ${MERCHANT_JWT_SECRET:?MERCHANT_JWT_SECRET is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9218"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - merchant-logs:/jeepayhomes/service/logs
      - merchant-uploads:/jeepayhomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9218/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  ui-payment:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    environment:
      BACKEND_HOST: payment:9216
    expose:
      - "80"
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-manager:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    environment:
      BACKEND_HOST: manager:9217
    expose:
      - "80"
    depends_on:
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-merchant:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    environment:
      BACKEND_HOST: merchant:9218
    expose:
      - "80"
    depends_on:
      merchant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql:
  redis:
  activemq:
  payment-logs:
  payment-uploads:
  manager-logs:
  manager-uploads:
  merchant-logs:
  merchant-uploads: