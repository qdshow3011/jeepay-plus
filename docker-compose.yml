services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    container_name: jeepay-mysql
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - jeepay

  redis:
    image: redis:7.4-alpine
    hostname: redis
    container_name: jeepay-redis
    ports:
      - "6380:6379"
    volumes:
      - redis:/data
    networks:
      - jeepay

  activemq:
    build:
      context: ./docker/activemq
      dockerfile: Dockerfile
    image: jeepay-activemq:latest
    hostname: activemq
    container_name: jeepay-activemq
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
    ports:
      - "8161:8161"
      - "61616:61616"
    volumes:
      - activemq:/opt/activemq/data
    networks:
      - jeepay

  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile
    image: jeepay-payment:latest
    hostname: payment
    container_name: jeepay-payment
    env_file:
      - .env
    ports:
      - "9216:9216"
    depends_on:
      - mysql
      - redis
      - activemq
    volumes:
      - ./logs/payment:/jeepayhomes/service/logs
      - ./conf/payment/application.yml:/jeepayhomes/service/app/application.yml:ro
    networks:
      - jeepay

  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile
    image: jeepay-manager:latest
    hostname: manager
    container_name: jeepay-manager
    env_file:
      - .env
    ports:
      - "9217:9217"
    depends_on:
      - mysql
      - redis
      - activemq
    volumes:
      - ./logs/manager:/jeepayhomes/service/logs
      - ./conf/manager/application.yml:/jeepayhomes/service/app/application.yml:ro
    networks:
      - jeepay

  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile
    image: jeepay-merchant:latest
    hostname: merchant
    container_name: jeepay-merchant
    env_file:
      - .env
    ports:
      - "9218:9218"
    depends_on:
      - mysql
      - redis
      - activemq
    volumes:
      - ./logs/merchant:/jeepayhomes/service/logs
      - ./conf/merchant/application.yml:/jeepayhomes/service/app/application.yml:ro
    networks:
      - jeepay

  ui-payment:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    image: jeepay-ui-payment:latest
    hostname: payment-ui
    container_name: jeepay-ui-payment
    environment:
      BACKEND_HOST: payment:9216
      PORT: 80
    ports:
      - "9226:80"
    depends_on:
      - payment
    networks:
      - jeepay

  ui-manager:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    image: jeepay-ui-manager:latest
    hostname: manager-ui
    container_name: jeepay-ui-manager
    environment:
      BACKEND_HOST: manager:9217
      PORT: 80
    ports:
      - "9227:80"
    depends_on:
      - manager
    networks:
      - jeepay

  ui-merchant:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    image: jeepay-ui-merchant:latest
    hostname: merchant-ui
    container_name: jeepay-ui-merchant
    environment:
      BACKEND_HOST: merchant:9218
      PORT: 80
    ports:
      - "9228:80"
    depends_on:
      - merchant
    networks:
      - jeepay

networks:
  jeepay:
    driver: bridge

volumes:
  mysql:
  redis:
  activemq:
