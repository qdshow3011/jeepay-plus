services:
  mysql:
    image: mysql:8.4
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-jeepay}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  activemq:
    build:
      context: ./docker/activemq
      dockerfile: Dockerfile
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-system}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
    ports:
      - "8161"
      - "61616"
    volumes:
      - activemq:/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8161/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-system}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:-http://localhost:9226,http://localhost:9227,http://localhost:9228}
    ports:
      - "9216"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - payment-logs:/jeepayhomes/service/logs
      - payment-uploads:/jeepayhomes/service/uploads
      - ./conf/payment/application.yml:/jeepayhomes/service/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9216/ || wget -q --spider http://localhost:9216/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-system}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:?MANAGER_JWT_SECRET is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:-http://localhost:9226,http://localhost:9227,http://localhost:9228}
    ports:
      - "9217"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - manager-logs:/jeepayhomes/service/logs
      - manager-uploads:/jeepayhomes/service/uploads
      - ./conf/manager/application.yml:/jeepayhomes/service/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9217/ || wget -q --spider http://localhost:9217/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeepaydb}
      MYSQL_USER: ${MYSQL_USER:-jeepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-system}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MERCHANT_JWT_SECRET: ${MERCHANT_JWT_SECRET:?MERCHANT_JWT_SECRET is required}
      JEEPAY_CORS_ALLOWED_ORIGINS: ${JEEPAY_CORS_ALLOWED_ORIGINS:-http://localhost:9226,http://localhost:9227,http://localhost:9228}
    ports:
      - "9218"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - merchant-logs:/jeepayhomes/service/logs
      - merchant-uploads:/jeepayhomes/service/uploads
      - ./conf/merchant/application.yml:/jeepayhomes/service/app/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9218/ || wget -q --spider http://localhost:9218/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  ui-payment:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    environment:
      BACKEND_HOST: payment:9216
      PORT: 80
    ports:
      - "80"
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-manager:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    environment:
      BACKEND_HOST: manager:9217
      PORT: 80
    ports:
      - "80"
    depends_on:
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-merchant:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    environment:
      BACKEND_HOST: merchant:9218
      PORT: 80
    ports:
      - "80"
    depends_on:
      merchant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql:
  redis:
  activemq:
  payment-logs:
  payment-uploads:
  manager-logs:
  manager-uploads:
  merchant-logs:
  merchant-uploads:
