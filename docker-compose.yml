services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysql -uroot -e \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    expose:
      - "6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  activemq:
    build:
      context: ./docker/activemq
      dockerfile: Dockerfile
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
    expose:
      - "61616"
    ports:
      - "8161:8161"
    volumes:
      - activemq:/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61616 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: jeepay-payment/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9216"
    ports:
      - "9216:9216"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - payment-logs:/openhubshomes/service/logs
      - payment-uploads:/openhubshomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9216/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: jeepay-manager/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:?MANAGER_JWT_SECRET is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9217"
    ports:
      - "9217:9217"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - manager-logs:/openhubshomes/service/logs
      - manager-uploads:/openhubshomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9217/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  merchant:
    build:
      context: .
      dockerfile: jeepay-merchant/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openhubsdb}
      MYSQL_USER: ${MYSQL_USER:-openhubs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD is required}
      MERCHANT_JWT_SECRET: ${MERCHANT_JWT_SECRET:?MERCHANT_JWT_SECRET is required}
      OPENHUBS_CORS_ALLOWED_ORIGINS: ${OPENHUBS_CORS_ALLOWED_ORIGINS:?}
    expose:
      - "9218"
    ports:
      - "9218:9218"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - merchant-logs:/openhubshomes/service/logs
      - merchant-uploads:/openhubshomes/service/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9218/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  ui-payment:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    environment:
      BACKEND_HOST: payment:9216
      PORT: 80
    expose:
      - "80"
    ports:
      - "9226:80"
    depends_on:
      payment:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-manager:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    environment:
      BACKEND_HOST: manager:9217
      PORT: 80
    expose:
      - "80"
    ports:
      - "9227:80"
    depends_on:
      manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ui-merchant:
    build:
      context: ./jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    environment:
      BACKEND_HOST: merchant:9218
      PORT: 80
    expose:
      - "80"
    ports:
      - "9228:80"
    depends_on:
      merchant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ============================================================
  # KitfoxPay - 易支付协议适配网关
  # 将 NewAPI 等下游系统的易支付协议请求转换为 Jeepay API 调用
  # ============================================================
  kitfoxpay:
    build:
      context: ./kitfoxpay
      dockerfile: Dockerfile
    container_name: openhubs-kitfoxpay
    ports:
      - "9229:9219"
    environment:
      JEEPAY_BASE_URL: http://payment:9216
      JEEPAY_MCH_NO: ${KITFOX_MCH_NO:-M1784708760}
      JEEPAY_APP_ID: ${KITFOX_APP_ID:-6a607e98e4b022b84e41f0e2}
      JEEPAY_PRIVATE_KEY: ${KITFOX_PRIVATE_KEY}
      EPAY_PID: ${KITFOX_EPAY_PID:-1001}
      EPAY_KEY: ${KITFOX_EPAY_KEY:-CHANGE_ME_32_CHARS_KEY_HERE}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9219"
      SITE_DOMAIN: ${KITFOX_SITE_DOMAIN:-http://localhost:9229}
      ADMIN_PASSWORD: ${KITFOX_ADMIN_PASSWORD:-admin123}
    depends_on:
      payment:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9219/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql:
  redis:
  activemq:
  payment-logs:
  payment-uploads:
  manager-logs:
  manager-uploads:
  merchant-logs:
  merchant-uploads: